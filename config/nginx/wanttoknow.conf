# Reject requests for unknown hostnames / direct-IP traffic.
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    return 444;
}
# ------------------------------------------------------------
# Legacy WantToKnow archive
#
# Public hostname:
#   archive.wanttoknow.info
#
# Content is fetched from the legacy server at its fixed IP.
# TLS identifies the upstream as wanttoknow.info, whose
# certificate is valid, while the HTTP Host header selects
# the legacy WantToKnow virtual host.
# ------------------------------------------------------------

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name archive.wanttoknow.info;

    # Permanently retired legacy forum/community application
    location = /c { return 410; }
    location ^~ /c/ { return 410; }

    location = /community { return 410; }
    location ^~ /community/ { return 410; }


    # Temporary origin certificate is sufficient because
    # archive will be Cloudflare-proxied in Full mode.
    ssl_certificate /etc/letsencrypt/live/new.wanttoknow.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/new.wanttoknow.info/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    # Archive SEO isolation.
    #
    # The archive root is not a second copy of the current homepage.
    location = / {
        return 301 https://www.wanttoknow.info/$is_args$args;
    }

    # Do not expose the legacy server's robots.txt, which advertises
    # the current www sitemap from the archive hostname.
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nAllow: /\n";
    }

    # Retire legacy sitemap files on the archive hostname.
    location = /sitemap.xml {
        return 410;
    }

    location = /sitemap2.xml {
        return 410;
    }

    location = /sitemap-2024-01-02.xml {
        return 410;
    }

    # Retired legacy application endpoints.
    location = /UpdArticle {
        return 410;
    }

    location = /UpdArticle.php {
        return 410;
    }

    location = /a {
        return 410;
    }

    location = /a.php {
        return 410;
    }
    location / {
        # A legacy path that now has a current-site replacement should
        # not also be served as duplicate content from the archive.
        if ($wtk_legacy_redirect ~ ^https://www\.wanttoknow\.info/) {
            return 301 $wtk_legacy_redirect$is_args$args;
        }

        if ($wtk_legacy_gone = 1) {
            return 410;
        }

        # Explicit ARCHIVE entries are canonical on the archive hostname.
        # Empty values emit no Link header for NEW, GONE, or unknown paths.
        add_header Link $wtk_archive_canonical_link;

        # Archive is read-only.
        limit_except GET {
            deny all;
        }

        # Permanently pin archive traffic to the legacy server.
        proxy_pass https://216.70.80.95;

        proxy_http_version 1.1;

        # Select the legacy WantToKnow virtual host.
        proxy_set_header Host www.wanttoknow.info;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host archive.wanttoknow.info;

        # Legacy archive HTML contains absolute asset URLs pointing at
        # www.wanttoknow.info. Since www now serves the rebuilt site,
        # rewrite src references so legacy assets continue to come from
        # the archive/legacy server.
        #
        # Disable compression from the upstream so nginx can modify HTML.
        proxy_set_header Accept-Encoding "";

        sub_filter_once off;

        sub_filter 'src="https://www.wanttoknow.info/' 'src="https://archive.wanttoknow.info/';
        sub_filter "src='https://www.wanttoknow.info/" "src='https://archive.wanttoknow.info/";

        sub_filter 'src="http://www.wanttoknow.info/' 'src="https://archive.wanttoknow.info/';
        sub_filter "src='http://www.wanttoknow.info/" "src='https://archive.wanttoknow.info/";

        sub_filter 'src="https://wanttoknow.info/' 'src="https://archive.wanttoknow.info/';
        sub_filter "src='https://wanttoknow.info/" "src='https://archive.wanttoknow.info/";

        sub_filter 'src="http://wanttoknow.info/' 'src="https://archive.wanttoknow.info/';
        sub_filter "src='http://wanttoknow.info/" "src='https://archive.wanttoknow.info/";

        # Validate legacy-server TLS using wanttoknow.info.
        proxy_ssl_server_name on;
        proxy_ssl_name wanttoknow.info;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;

        # Keep legacy redirects on the archive hostname.
        proxy_redirect https://www.wanttoknow.info/ https://archive.wanttoknow.info/;
        proxy_redirect http://www.wanttoknow.info/ https://archive.wanttoknow.info/;

        proxy_connect_timeout 15s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}


server {
    listen 80;
    listen [::]:80;

    server_name archive.wanttoknow.info;

    return 301 https://archive.wanttoknow.info$request_uri;
}
