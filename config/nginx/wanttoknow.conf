server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name new.wanttoknow.info;

    ssl_certificate /etc/letsencrypt/live/new.wanttoknow.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/new.wanttoknow.info/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.wanttoknow.info$request_uri;
}

server {
