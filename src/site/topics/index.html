<body>
  <a class="skip-link" href="#main-content">
    Skip to main content
  </a>

  <div
    id="global-header"
    data-global-header
  ></div>

  <main id="main-content">

    <section
      class="topics-index-intro"
      aria-labelledby="topics-index-title"
    >
      <div class="container topics-index-intro__inner">

        <p class="eyebrow">
          Explore WantToKnow.info
        </p>

        <h1
          class="topics-index-title"
          id="topics-index-title"
        >
          Full Index Of News Topics
        </h1>

        <p class="topics-index-subhead">
          Browse our full topic map and explore the news categories organized
          within each major subject area.
        </p>

      </div>
    </section>

    <section
      class="archive-viz archive-viz--topics section"
      data-archive-viz
      data-viz-view="topics"
      data-stats-url="/data/archive_stats.json"
      data-category-map-url="/data/news-category-map.json"
      data-topic-url-template="/topics/{slug}/"
      data-category-url-template="/news/category/{slug}/"
      aria-labelledby="archive-topics-title"
    >
      <div class="container">

        <div class="archive-viz__panel">
          <div
            class="archive-viz__stage"
            data-viz-stage
            role="region"
            aria-live="polite"
            aria-busy="true"
            aria-label="WantToKnow.info topics and categories"
          >
            <div
              class="archive-viz__loading"
              data-viz-loading
            >
              <span
                class="archive-viz__loading-mark"
                aria-hidden="true"
              ></span>

              <span>Loading topics…</span>
            </div>
          </div>
        </div>

        <noscript>
          <p class="archive-viz__noscript">
            This topic visualization requires JavaScript.
          </p>
        </noscript>

      </div>
    </section>

  </main>

  <div
    id="global-footer"
    data-global-footer
  ></div>
