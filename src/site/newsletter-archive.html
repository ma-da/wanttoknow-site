  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "CollectionPage",
    "@id": "https://www.wanttoknow.info/newsletter-archive.html#webpage",
    "url": "https://www.wanttoknow.info/newsletter-archive.html",

  <link rel="stylesheet" href="/assets/css/global.css">

<body>
  <div id="global-header" data-global-header></div>

  <main id="main-content" class="newsletter-archive-page">
    <div class="newsletter-archive-controls">
      <label class="visually-hidden" for="newsletter-archive-select">
        Choose newsletter
      </label>

      <select
        id="newsletter-archive-select"
        class="newsletter-archive-select"
        aria-label="Choose newsletter"
      >
        <option>Loading newsletters…</option>
      </select>

      <p
        id="newsletter-archive-status"
        class="newsletter-archive-status"
        aria-live="polite"
      ></p>
    </div>

    <iframe
      id="newsletter-archive-frame"
      class="newsletter-archive-frame"
      title="WantToKnow.info newsletter"
      sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox"
    ></iframe>
  </main>

  <div id="global-footer" data-global-footer></div>
</body>
