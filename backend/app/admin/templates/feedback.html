<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >
  <meta
    name="robots"
    content="noindex,nofollow,noarchive"
  >

  <title>Feedback | WantToKnow.info Admin</title>

  <link
    rel="stylesheet"
    href="/assets/css/global.css"
  >
  <link
    rel="stylesheet"
    href="/admin/assets/admin.css"
  >

  <script
    src="/admin/assets/feedback.js"
    defer
  ></script>
</head>

<body>
  <header class="admin-header">
    <div class="container admin-header-inner">
      <a
        class="admin-brand"
        href="/admin"
        aria-label="WantToKnow.info admin home"
      >

        <span class="admin-brand-text">
          WantToKnow.info Admin
        </span>
      </a>

      <div class="admin-header-actions">
        <a
          class="button button-secondary button-small"
          href="/admin/articles"
        >
          Articles
        </a>

        <a
          class="button button-secondary button-small"
          href="/admin/newsletters"
        >
          Newsletter
        </a>

        <a
          class="button button-secondary button-small"
          href="https://new.wanttoknow.info/"
          target="_blank"
          rel="noopener"
        >
          View site
        </a>
      </div>
    </div>
  </header>

  <main class="container admin-shell">
<div class="feedback-control-bar">

  <nav
    class="admin-tabs feedback-control-tabs"
    aria-label="Feedback type"
  >
    <button
      class="admin-tab is-active"
      type="button"
      data-feedback-tab="contact"
    >
      Contact Messages
    </button>

    <button
      class="admin-tab"
      type="button"
      data-feedback-tab="survey"
    >
      Site Survey
    </button>
  </nav>

  <div
    class="admin-stats feedback-stats"
    aria-label="Feedback totals"
  >
    <div class="admin-stat">
      <strong id="contact-total">—</strong>
      <span>Contact</span>
    </div>

    <div class="admin-stat">
      <strong id="survey-total">—</strong>
      <span>Survey</span>
    </div>

    <div class="admin-stat">
      <strong id="visible-total">—</strong>
      <span>Shown</span>
    </div>
  </div>

  <div class="feedback-control-search">
    <input
      id="feedback-search"
      class="admin-field"
      type="search"
      placeholder="Search responses…"
      autocomplete="off"
    >
  </div>

  <label class="feedback-filter">
    <span class="visually-hidden">
      Filter feedback
    </span>

    <select
      id="feedback-filter"
      class="admin-field admin-select"
    >
      <option value="all">All</option>
      <option value="unread">Unread</option>
      <option value="archived">Archived</option>
    </select>
  </label>

</div>

<div
  id="feedback-status"
  class="feedback-status"
  aria-live="polite"
></div>

    <div class="feedback-dashboard">
      <div class="feedback-dashboard-main">

    <section
      id="contact-panel"
      class="admin-panel"
      aria-label="Contact messages"
    >
      <div
        id="contact-list"
        class="feedback-list"
      ></div>
    </section>

    <section
      id="survey-panel"
      class="admin-panel"
      aria-label="Survey responses"
      hidden
    >
      <div
        id="survey-list"
        class="feedback-list"
      ></div>
    </section>

      </div>

      <aside
        class="feedback-pageviews"
        aria-label="Recent page visits"
      >
        <h2 id="feedback-pageviews-title">
          Recent Visits — Total Visits —
        </h2>

        <div class="feedback-pageviews-head">
          <span>Daily</span>
          <span>Page</span>
          <span>Total</span>
        </div>

        <div
          id="feedback-pageviews"
          class="feedback-pageviews-list"
        >
          Loading…
        </div>
      </aside>
    </div>
  </main>
</body>
</html>
